# LiteLLM Proxy 配置模板（`TS-2` · 网关只做路由与限流）。
#
# 为什么是模板而不是真配置：真配置由 `lib/gateway/litellm-config.ts` 依据
# `model_providers` 表生成（`npm run gateway:config` → `config.generated.yaml`）。
# 这里只保留一份**结构等价**的样例，用来解释生成物长什么样、为什么长这样；
# `tests/litellm-sidecar.spec.ts` 会断言两者同构，避免模板慢慢变成谎言。
#
# 两条边界（`docs/工程规则.md` §9、`technical-solution.md` TS-2）：
#
#  1. **api_key 只写 `os.environ/<变量名>`**。不要在这里写任何明文 Key，
#     这个文件会进仓库。
#  2. **不写任何计费字段**（`input_cost_per_token` / `output_cost_per_token` 等）。
#     所有成本一律由我方 `tokens_in/out × model_prices 单价` 自行计算；
#     LiteLLM 自带的成本统计不读、不落库、不展示。

model_list:
  - model_name: deepseek-chat
    litellm_params:
      model: openai/deepseek-chat
      api_base: https://api.deepseek.com
      # 变量名由厂商 id 稳定推导：LITELLM_PROVIDER_KEY_<去掉连字符的 UUID 大写>
      api_key: os.environ/LITELLM_PROVIDER_KEY_11111111111141118111111111111111
      # 三个限流参数写在同一个段里：并发 / rpm / tpm 是同一件事的三个侧面
      max_parallel_requests: 4
      rpm: 60
      tpm: 100000
    model_info:
      display_name: DeepSeek Chat

router_settings:
  # 重试与退避归 lib/gateway/index.ts 管；这里归零，否则两边重试会相乘
  num_retries: 0
  routing_strategy: least-busy
